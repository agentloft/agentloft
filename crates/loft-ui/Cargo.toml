[package]
name = "loft-ui"
description = "Agentloft GPUI views: sidebar, thread timeline, composer"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[features]
# `doc_preview --shot` (examples/): the window's own frame as a picture, which
# needs GPUI's test support, in GPUI and in its macOS backend. Off otherwise,
# for the reason loft-terminal gives.
shots = ["loft-terminal/test-support", "dep:gpui-macos-shots"]

[dependencies]
# Local times ("Resets Sat 6:00 AM").
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
# Image dimensions from file headers (reply images keep their proportions).
imagesize = "0.14"
# Pictures of the daemon's browser pages (JPEG), decoded for GPUI.
image = { version = "0.25", default-features = false, features = ["jpeg"] }
# The web access pairing link as a QR code, for a phone's camera.
qrcode = { version = "0.14", default-features = false }
loft-protocol.workspace = true
loft-view.workspace = true
loft-client.workspace = true
loft-config.workspace = true
loft-docs = { path = "../loft-docs" }
loft-browser = { path = "../loft-browser" }
loft-terminal.workspace = true
anyhow.workspace = true
futures.workspace = true
tracing.workspace = true
serde_json.workspace = true
serde.workspace = true
toml.workspace = true
# `Instant`/`SystemTime` that also work in the browser (std's panic there);
# the std types themselves on native targets.
web-time = "1"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
gpui-kit = { workspace = true, features = ["tree-sitter-languages"] }
tokio.workspace = true

# The browser build (crates/loft-web, ADR-0016): only tokio's channels.
[target.'cfg(target_arch = "wasm32")'.dependencies]
gpui-kit = { workspace = true, features = ["syntect"] }
tokio = { version = "1", default-features = false, features = ["sync"] }
chrono = { version = "0.4", default-features = false, features = ["clock", "std", "wasmbind"] }
# The window layout lives in the browser's localStorage.
web-sys = { version = "0.3", features = [
  "Event", "Storage", "Window",
  # Videos (video.rs): a hidden <video>, its frames copied through a canvas.
  "Document", "Element", "HtmlElement", "HtmlMediaElement", "HtmlVideoElement",
  "HtmlCanvasElement", "CanvasRenderingContext2d", "ImageData", "MediaError", "Node",
] }
wasm-bindgen = "=0.2.130"

[target.'cfg(target_os = "macos")'.dependencies]
gpui-macos-shots = { package = "gpui-pre-macos", version = "=0.3.11", features = ["test-support"], optional = true }
workspace-hack.workspace = true
objc2.workspace = true
objc2-app-kit = { workspace = true, features = ["NSDockTile", "NSWorkspace", "objc2-core-graphics"] }
objc2-foundation = { workspace = true, features = ["NSBundle"] }
objc2-user-notifications = { version = "0.3.2", default-features = false, features = ["std", "block2", "UNUserNotificationCenter", "UNNotificationContent", "UNNotificationRequest", "UNNotificationTrigger"] }
block2 = "0.6"
# Video in the chat (video.rs): AVPlayer's frames, drawn by GPUI.
objc2-av-foundation = { version = "0.3.2", default-features = false, features = ["std", "AVPlayer", "AVPlayerItem", "AVPlayerItemOutput", "objc2-core-foundation", "objc2-core-media", "objc2-core-video"] }
objc2-core-media = { version = "0.3.2", default-features = false, features = ["std", "objc2", "CMTime"] }
objc2-core-video = { version = "0.3.2", default-features = false, features = ["std", "objc2", "CVBuffer", "CVImageBuffer", "CVPixelBuffer"] }
objc2-core-foundation = { version = "0.3.2", default-features = false, features = ["std", "objc2", "CFString"] }
# Turned slide text (panel/slides.rs): its letters as outlines, in the fonts
# macOS keeps for documents. The version GPUI draws SVGs with.
usvg = { version = "0.46", default-features = false, features = ["text", "system-fonts", "memmap-fonts"] }

[dev-dependencies]
tempfile.workspace = true

[lints]
workspace = true
