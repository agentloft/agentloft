[package]
name = "loft-core"
description = "Agentloft domain core: requests, thread actors, event bus, recovery"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
loft-protocol.workspace = true
loft-view.workspace = true
loft-page-script.workspace = true
loft-page-exec.workspace = true
# What the daemon says to its iOS simulator helper (devices/ios.rs).
loft-sim.workspace = true
url.workspace = true
loft-store.workspace = true
loft-harness.workspace = true
loft-config.workspace = true
loft-voice.workspace = true
loft-git.workspace = true
ignore.workspace = true
portable-pty.workspace = true
serde.workspace = true
tokio.workspace = true
# Captured JSON keeps its keys in order (bodies, and the exchanges agents read).
serde_json = { workspace = true, features = ["preserve_order"] }
toml.workspace = true
toml_edit.workspace = true
anyhow.workspace = true
tracing.workspace = true
uuid.workspace = true
base64.workspace = true
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
# Agents' capture tools (pages/capture): screenshots with labels and diffs,
# and recordings kept at one size.
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
regex = "1"
# Android emulators' gRPC control service (devices/android/grpc.rs): plain
# HTTP/2 on localhost, messages written by hand.
h2 = "0.4"
http = "1"
bytes.workspace = true
prost = { version = "0.14", default-features = false, features = ["derive", "std"] }

[target.'cfg(unix)'.dependencies]
# The headless browser's DevTools pipes, on its fds 3 and 4 (pages/cdp.rs).
command-fds = { version = "0.3.3", features = ["tokio"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation"] }

[dev-dependencies]
tempfile.workspace = true

# One build of each dependency whatever the cargo command (.config/hakari.toml).
[target.'cfg(target_os = "macos")'.dependencies]
workspace-hack.workspace = true
# Which simulator app is in front: its process's Darwin role (devices/ios.rs).
libc.workspace = true

[lints]
workspace = true
