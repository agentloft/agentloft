[package]
name = "loft-web"
description = "Agentloft in the browser: the GPUI app compiled to WebAssembly (ADR-0016)"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[lib]
# cdylib for wasm-bindgen; rlib so native `cargo check --workspace` has a target.
crate-type = ["cdylib", "rlib"]

[target.'cfg(target_arch = "wasm32")'.dependencies]
gpui-kit.workspace = true
loft-ui.workspace = true
loft-client.workspace = true
loft-config.workspace = true
loft-protocol.workspace = true
anyhow.workspace = true
log = "0.4"
# `tracing` events reach the browser console through `log`.
tracing = { workspace = true, features = ["log"] }
# Pinned with xtask's wasm-bindgen-cli-support: the two must match exactly.
wasm-bindgen = "=0.2.130"
web-sys = { version = "0.3", features = ["Document", "Element", "Event", "Window"] }

[lints]
workspace = true
