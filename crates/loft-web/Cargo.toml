[package]
name = "loft-web"
description = "Agentloft in the browser: the GPUI app compiled to WebAssembly (ADR-0016)"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[lib]
# cdylib for wasm-bindgen; rlib so native `cargo check --workspace` has a target.
crate-type = ["cdylib", "rlib"]

[target.'cfg(target_arch = "wasm32")'.dependencies]
gpui-kit = { version = "=0.9.0" }
# Pinned with xtask's wasm-bindgen-cli-support: the two must match exactly.
wasm-bindgen = "=0.2.130"

[lints]
workspace = true
