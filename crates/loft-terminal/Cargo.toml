[package]
name = "loft-terminal"
description = "Agentloft terminal widget: a GPUI element backed by libghostty-vt"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
gpui-kit.workspace = true
ghostty-vt.workspace = true
tracing.workspace = true
# `Instant` that also works in the browser build (crates/loft-web).
web-time = "1"

[dev-dependencies]
# GPUI's headless test platform for tests/view.rs. Enabled on gpui-pre
# directly (the exact version gpui-kit 0.9.0 pins): gpui-kit's own
# `test-support` feature drags its optional gpui-fast backend into resolution.
gpui = { package = "gpui-pre", version = "=0.3.11", features = ["test-support"] }
portable-pty.workspace = true
anyhow.workspace = true
futures.workspace = true

[lints]
workspace = true
