<style>
  .controls { display: flex; flex-wrap: wrap; gap: 18px; align-items: end; }
  .controls > div { display: grid; gap: 6px; }
  .seats { flex: 1; min-width: 200px; }
  .seats span { display: flex; justify-content: space-between; }
  .seats input { width: 100%; }
  .seg { display: inline-flex; padding: 2px; border-radius: 9px; background: var(--surface); }
  .seg button { border: 0; padding: 4px 12px; border-radius: 7px; color: var(--muted); }
  .seg button[aria-pressed="true"] { background: color-mix(in srgb, var(--accent) 22%, var(--bg)); color: var(--fg); font-weight: 500; }
  .tiles { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin: 14px 0; }
  .tile { border: 1px solid var(--border); border-radius: 10px; padding: 10px 12px; }
  .tile b { display: block; font-size: 22px; line-height: 1.3; font-variant-numeric: tabular-nums; }
  svg { display: block; width: 100%; height: 190px; }
  .legend { display: flex; gap: 16px; font-size: 12px; color: var(--muted); }
  .legend i { display: inline-block; width: 10px; height: 3px; border-radius: 2px; margin-right: 6px; vertical-align: middle; }
  .tip { padding: 9px 12px; border-radius: 10px; margin: 12px 0;
         border: 1px solid color-mix(in srgb, var(--accent) 40%, transparent);
         background: color-mix(in srgb, var(--accent) 9%, transparent); }
  label.check { display: flex; align-items: center; gap: 8px; color: var(--fg); }
</style>

<div class="controls">
  <div class="seats">
    <span><label for="seats">Seats</label><b id="seats-out"></b></span>
    <input id="seats" type="range" min="1" max="100">
  </div>
  <div>
    <label>Tier</label>
    <div class="seg" id="tier">
      <button data-tier="starter">Starter</button><button data-tier="pro">Pro</button><button data-tier="scale">Scale</button>
    </div>
  </div>
  <label class="check"><input id="annual" type="checkbox"> Bill yearly (−20%)</label>
</div>

<div class="tiles">
  <div class="tile"><small>Per seat</small><b id="per"></b><small>per month</small></div>
  <div class="tile"><small>Monthly</small><b id="monthly"></b><small id="monthly-note"></small></div>
  <div class="tile"><small>Yearly</small><b id="yearly"></b><small id="saving"></small></div>
</div>

<div class="legend"><span><i style="background:#2a78d6"></i>Billed monthly</span><span><i style="background:#eb6834"></i>Billed yearly</span></div>
<svg id="chart" viewBox="0 0 600 190" preserveAspectRatio="none"></svg>

<div class="tip" id="tip" hidden>From 50 seats up, volume pricing applies: ask sales for a quote.</div>
<button class="primary" id="draft">Draft the purchase request</button>

<script>
  const price = { starter: 8, pro: 20, scale: 45 };
  const usd = (n) => "$" + Math.round(n).toLocaleString("en-US");
  const state = Object.assign({ seats: 12, tier: "pro", annual: true }, agentloft.state || {});
  const $ = (id) => document.getElementById(id);

  function draw() {
    const each = price[state.tier] * (state.annual ? 0.8 : 1);
    $("seats").value = state.seats;
    $("seats-out").textContent = state.seats;
    $("annual").checked = state.annual;
    for (const b of $("tier").children) b.setAttribute("aria-pressed", b.dataset.tier === state.tier);
    $("per").textContent = usd(each);
    $("monthly").textContent = usd(each * state.seats);
    $("monthly-note").textContent = state.seats + " seats";
    $("yearly").textContent = usd(each * state.seats * 12);
    $("saving").textContent = state.annual ? "20% off" : "";
    $("tip").hidden = state.seats < 50;

    // Two lines over 0–100 seats, and a marker where the slider is.
    const top = price[state.tier] * 100, x = (n) => n * 6, y = (v) => 180 - (v / top) * 165;
    const line = (rate) => `M0,${y(0)} L600,${y(100 * rate)}`;
    const monthly = price[state.tier], yearly = monthly * 0.8;
    $("chart").innerHTML = `
      ${[0.25, 0.5, 0.75, 1].map((f) => `<line x1="0" x2="600" y1="${y(top * f)}" y2="${y(top * f)}" stroke="var(--border)" stroke-dasharray="3 4"/>`).join("")}
      <path d="${line(monthly)} L600,180 L0,180 Z" fill="#2a78d6" opacity="0.12"/>
      <path d="${line(monthly)}" stroke="#2a78d6" stroke-width="2" fill="none" vector-effect="non-scaling-stroke"/>
      <path d="${line(yearly)}" stroke="#eb6834" stroke-width="2" fill="none" vector-effect="non-scaling-stroke"/>
      <line x1="${x(state.seats)}" x2="${x(state.seats)}" y1="10" y2="180" stroke="var(--muted)" stroke-dasharray="2 3"/>
      <circle cx="${x(state.seats)}" cy="${y(state.seats * (state.annual ? yearly : monthly))}" r="4.5" fill="var(--accent)" stroke="var(--bg)" stroke-width="2"/>`;
  }
  function change(patch) {
    Object.assign(state, patch);
    agentloft.setState(state);
    draw();
  }
  $("seats").oninput = (e) => change({ seats: +e.target.value });
  $("annual").onchange = (e) => change({ annual: e.target.checked });
  $("tier").onclick = (e) => e.target.dataset.tier && change({ tier: e.target.dataset.tier });
  $("draft").onclick = () =>
    agentloft.send(`Draft a purchase request for ${state.seats} ${state.tier} seats, billed ${state.annual ? "yearly" : "monthly"}.`);
  draw();
</script>
