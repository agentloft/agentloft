[package]
name = "loft-app"
description = "Agentloft desktop app (GPUI client)"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "agentloft"
path = "src/main.rs"

[dependencies]
gpui-kit.workspace = true
loft-ui.workspace = true
loft-config.workspace = true
tokio.workspace = true
anyhow.workspace = true
tracing-subscriber.workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
workspace-hack.workspace = true
objc2 = "0.6"
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSApplication", "NSImage", "NSResponder"] }
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSData"] }

[lints]
workspace = true
