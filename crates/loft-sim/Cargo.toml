[package]
name = "loft-sim"
description = "iOS simulators' screens and input, in a helper process of the daemon (ADR-0020)"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
loft-protocol.workspace = true
serde.workspace = true
serde_json.workspace = true
anyhow.workspace = true

# The helper itself talks to Xcode's private CoreSimulator and SimulatorKit
# frameworks through the Objective-C runtime (ADR-0020).
[target.'cfg(target_os = "macos")'.dependencies]
workspace-hack.workspace = true
objc2 = { workspace = true, features = ["exception"] }
objc2-foundation.workspace = true
block2.workspace = true
libc.workspace = true

[lints]
workspace = true
