[package]
name = "loft-voice"
description = "Voice input: speech models, their downloads, and the engine process that runs them"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
loft-protocol.workspace = true
loft-llm.workspace = true
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
tracing.workspace = true
sha2 = "0.10"
# Speech to text (the engine process): transcribe.cpp, Metal on Apple.
transcribe-cpp = "0.4.2"
workspace-hack.workspace = true

# The OS's TLS stack on macOS and Windows, rustls elsewhere (as loftd does).
[target.'cfg(any(target_os = "macos", windows))'.dependencies]
ureq = { version = "3", default-features = false, features = ["native-tls", "gzip"] }

[target.'cfg(not(any(target_os = "macos", windows)))'.dependencies]
ureq = { version = "3", default-features = false, features = ["rustls", "gzip"] }

[dev-dependencies]
tempfile.workspace = true

[lints]
workspace = true
