# One build of each dependency, whatever the cargo command: this crate names
# the dependencies that our crates would otherwise ask for with different
# features depending on which packages a command selects, with all of those
# features. Every crate in crates/ depends on it (on macOS). Why, and how it
# is configured: .config/hakari.toml.
#
# The list below is written by `cargo hakari generate`. Run it after changing
# dependencies or their features; don't edit the list by hand.

[package]
name = "workspace-hack"
description = "Unifies dependency features across the workspace (generated by cargo-hakari)"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish.workspace = true

