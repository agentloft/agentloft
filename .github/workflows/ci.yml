name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Read-only unless a job says otherwise (only publishing writes).
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  # libghostty-vt's finished builds (vendor/ghostty-vt-sys), kept between
  # runs by the cache step before each Zig build: building it downloads its
  # Zig packages, and that download failing has failed releases.
  GHOSTTY_VT_CACHE_DIR: ${{ github.workspace }}/.ghostty-vt
  RUSTFLAGS: -D warnings

jobs:
  macos:
    name: macOS (full workspace)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Install toolchain (rust-toolchain.toml)
        run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: .ghostty-vt
          key: ghostty-vt-${{ github.job }}-${{ runner.os }}-${{ hashFiles('vendor/ghostty-vt-sys/GHOSTTY.lock', 'vendor/ghostty-vt-sys/build.rs') }}
      # loft-terminal builds libghostty-vt, which needs Zig.
      - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2
        with:
          version: 0.17.1
      # libghostty-vt's build needs the aro C front end, which its Zig
      # packages fetch from codeberg.org; that host doesn't always resolve on
      # GitHub's runners (it failed 0.0.7 and 0.0.8). The same commit from
      # GitHub has the same package hash, so it goes in Zig's cache first.
      - name: aro from GitHub
        # By git, not GitHub's archive: Zig keeps an archive with its top
        # folder, and that copy hashes differently when a build reuses it.
        run: zig fetch "git+https://github.com/Vexu/arocc#d0c8c4d9c55daa7ef6e40cf0f630a5b5e900989b"
      - name: Format
        run: cargo fmt --all --check
      # `loft-terminal/test-support`: its view tests run on GPUI's test
      # platform, which is a feature (crates/loft-terminal/Cargo.toml).
      - name: Clippy
        run: cargo clippy --workspace --all-targets --features loft-terminal/test-support -- -D warnings
      - name: Test
        run: cargo test --workspace --features loft-terminal/test-support

  linux-headless:
    name: Linux (headless crates)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Install toolchain (rust-toolchain.toml)
        run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - name: Test headless crates
        run: >
          cargo test
          -p loft-protocol -p loft-config -p loft-store -p loft-git -p loft-harness
          -p loft-harness-claude -p loft-harness-codex -p loft-core -p loft-client
          -p loft-docs -p loftd

  # The desktop app and daemon on the other two platforms the releases are
  # built for (.github/workflows/release.yml).
  linux-app:
    name: Linux (app and daemon)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: System libraries (GPUI)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config clang libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev \
            libfontconfig1-dev libfreetype-dev libx11-xcb-dev libxcb1-dev \
            libvulkan-dev libasound2-dev libssl-dev libzstd-dev
      - name: Install toolchain (rust-toolchain.toml)
        run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: .ghostty-vt
          key: ghostty-vt-${{ github.job }}-${{ runner.os }}-${{ hashFiles('vendor/ghostty-vt-sys/GHOSTTY.lock', 'vendor/ghostty-vt-sys/build.rs') }}
      - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2
        with:
          version: 0.17.1
      # libghostty-vt's build needs the aro C front end, which its Zig
      # packages fetch from codeberg.org; that host doesn't always resolve on
      # GitHub's runners (it failed 0.0.7 and 0.0.8). The same commit from
      # GitHub has the same package hash, so it goes in Zig's cache first.
      - name: aro from GitHub
        # By git, not GitHub's archive: Zig keeps an archive with its top
        # folder, and that copy hashes differently when a build reuses it.
        run: zig fetch "git+https://github.com/Vexu/arocc#d0c8c4d9c55daa7ef6e40cf0f630a5b5e900989b"
      - name: Clippy (app and daemon)
        run: cargo clippy -p loft-app -p loftd --all-targets -- -D warnings

  windows:
    name: Windows (app and daemon)
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Install toolchain (rust-toolchain.toml)
        run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          # Windows builds are slow (no Linux-speed disk): keep what was
          # built even when a later step fails.
          cache-on-failure: true
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: .ghostty-vt
          key: ghostty-vt-${{ github.job }}-${{ runner.os }}-${{ hashFiles('vendor/ghostty-vt-sys/GHOSTTY.lock', 'vendor/ghostty-vt-sys/build.rs') }}
      - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2
        with:
          version: 0.17.1
      # libghostty-vt's build needs the aro C front end, which its Zig
      # packages fetch from codeberg.org; that host doesn't always resolve on
      # GitHub's runners (it failed 0.0.7 and 0.0.8). The same commit from
      # GitHub has the same package hash, so it goes in Zig's cache first.
      - name: aro from GitHub
        # By git, not GitHub's archive: Zig keeps an archive with its top
        # folder, and that copy hashes differently when a build reuses it.
        run: zig fetch "git+https://github.com/Vexu/arocc#d0c8c4d9c55daa7ef6e40cf0f630a5b5e900989b"
      - name: Clippy (app and daemon)
        run: cargo clippy -p loft-app -p loftd --all-targets -- -D warnings
      - name: Test (config, client, daemon end to end)
        run: |
          cargo test -p loft-config -p loft-client --lib
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo test -p loftd --test e2e

  web:
    name: Web client (wasm32)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Install toolchain (rust-toolchain.toml)
        run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: .ghostty-vt
          key: ghostty-vt-${{ github.job }}-${{ runner.os }}-${{ hashFiles('vendor/ghostty-vt-sys/GHOSTTY.lock', 'vendor/ghostty-vt-sys/build.rs') }}
      # The terminal in the browser is libghostty-vt built for wasm32, which
      # needs Zig like the native build does.
      - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2
        with:
          version: 0.17.1
      # libghostty-vt's build needs the aro C front end, which its Zig
      # packages fetch from codeberg.org; that host doesn't always resolve on
      # GitHub's runners (it failed 0.0.7 and 0.0.8). The same commit from
      # GitHub has the same package hash, so it goes in Zig's cache first.
      - name: aro from GitHub
        # By git, not GitHub's archive: Zig keeps an archive with its top
        # folder, and that copy hashes differently when a build reuses it.
        run: zig fetch "git+https://github.com/Vexu/arocc#d0c8c4d9c55daa7ef6e40cf0f630a5b5e900989b"
      # The browser-only code paths (cfg(target_arch = "wasm32")) that the
      # native clippy run never sees. RUSTC_BOOTSTRAP: see the `web` task in
      # xtask/src/main.rs.
      - name: Clippy (wasm32)
        run: cargo clippy -p loft-web --target wasm32-unknown-unknown -- -D warnings
        env:
          RUSTC_BOOTSTRAP: wasm_thread
          # std's clock panics in the browser: forbidden there (see the file).
          CLIPPY_CONF_DIR: .config/clippy-wasm
      # Builds crates/loft-web for wasm32-unknown-unknown and generates the
      # JS glue into target/web.
      - name: Build the web bundle
        run: cargo xtask web

  workspace-hack:
    name: Dependency features (workspace-hack)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Install toolchain (rust-toolchain.toml)
        run: rustup show active-toolchain || rustup toolchain install
      - uses: taiki-e/install-action@75a7c0f87bd666af3cdb75c5b9e9d03ab6044e6f # v2
        with:
          tool: cargo-hakari
      # crates/workspace-hack is what `cargo hakari generate` writes for the
      # dependencies as they are now (.config/hakari.toml says what it is for).
      - name: workspace-hack is up to date
        run: cargo hakari generate --diff

  deny:
    name: Dependency policy
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: EmbarkStudios/cargo-deny-action@70f81531115945ba6eb6b941ec9d39d063438eb9 # v2