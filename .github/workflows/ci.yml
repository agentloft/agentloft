name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  macos:
    name: macOS (full workspace)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Install toolchain (rust-toolchain.toml)
        run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      # loft-terminal builds libghostty-vt, which needs Zig.
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.17.1
      - name: Format
        run: cargo fmt --all --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Test
        run: cargo test --workspace

  linux-headless:
    name: Linux (headless crates)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install toolchain (rust-toolchain.toml)
        run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - name: Test headless crates
        run: >
          cargo test
          -p loft-protocol -p loft-config -p loft-store -p loft-git -p loft-harness
          -p loft-harness-claude -p loft-harness-codex -p loft-core -p loft-client
          -p loft-docs -p loftd

  web:
    name: Web client (wasm32)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install toolchain (rust-toolchain.toml)
        run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      # Builds crates/loft-web for wasm32-unknown-unknown and generates the
      # JS glue into target/web.
      - name: Build the web bundle
        run: cargo xtask web

  deny:
    name: Dependency policy
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2
