name: Release

# Builds Agentloft for macOS, Windows and Linux.
# - A tag `v*` publishes the builds as that GitHub release (a tag with a `-`,
#   like v0.1.0-rc1, as a pre-release).
# - A push to the `release-test` branch, or running it by hand, builds
#   everything without publishing: the files are the run's artifacts.
# - Every night it builds on main, only to keep the build caches warm.
#
# What it publishes (the website's download buttons link to these names):
#   Agentloft-macos-arm64.dmg
#   Agentloft-windows-x64-setup.exe, Agentloft-windows-x64.zip
#   Agentloft-linux-x64.tar.gz
#
# The browser client (the same on every platform) and each platform's
# binaries are built at the same time; packaging, which needs both, is quick.
# macOS is packaged in the job that builds it: a job of its own waited for a
# second macOS runner (5 minutes for 0.0.10, after 10 for the first).
#
# Build caches: GitHub lets a run read only the caches of its own ref and of
# main. A tag's run can never read another tag's, so every release used to
# compile every dependency from nothing (13-20 minutes a platform). So the
# caches are saved on main only: by the nightly run, which builds whenever
# the dependencies changed since its last cache, and by running this by hand
# on main. A tag's run reads them and saves nothing (a cache saved under a
# tag is never read again, and uploading it took one to two minutes).

on:
  push:
    tags: ["v*"]
    branches: [release-test]
  schedule:
    - cron: "23 3 * * *"
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

# Read-only unless a job says otherwise (only publishing writes).
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  # libghostty-vt's finished build (vendor/ghostty-vt-sys), restored by the
  # cache step before each Rust build, under the same keys as CI's: a tag's
  # run reads the library CI built on main (same Zig, target and flags, so
  # the same library) instead of building it with Zig (one to four minutes).
  GHOSTTY_VT_CACHE_DIR: ${{ github.workspace }}/.ghostty-vt
  # The nightly run only warms the caches: when its dependencies are cached
  # exactly as they are now, it has nothing to add and skips the build.
  WARM_ONLY: ${{ github.event_name == 'schedule' }}

jobs:
  web:
    name: Web client
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: ./.github/actions/rust-toolchain
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        id: rust-cache
        with:
          key: release-web
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        id: ghostty
        with:
          path: .ghostty-vt
          # CI's `web` job's key (.github/workflows/ci.yml).
          key: ghostty-vt-web-${{ runner.os }}-${{ hashFiles('vendor/ghostty-vt-sys/GHOSTTY.lock', 'vendor/ghostty-vt-sys/build.rs') }}
      # Zig builds libghostty-vt, when it isn't cached.
      - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2
        if: steps.ghostty.outputs.cache-hit != 'true'
        with:
          version: 0.17.1
      # libghostty-vt's build needs the aro C front end, which its Zig
      # packages fetch from codeberg.org; that host doesn't always resolve on
      # GitHub's runners (it failed 0.0.7 and 0.0.8). The same commit from
      # GitHub has the same package hash, so it goes in Zig's cache first.
      - name: aro from GitHub
        if: steps.ghostty.outputs.cache-hit != 'true'
        # By git, not GitHub's archive: Zig keeps an archive with its top
        # folder, and that copy hashes differently when a build reuses it.
        run: zig fetch "git+https://github.com/Vexu/arocc#d0c8c4d9c55daa7ef6e40cf0f630a5b5e900989b"
      # Building libghostty-vt (the terminal) downloads its Zig packages,
      # and a dropped download has failed releases: tried up to three times.
      - if: env.WARM_ONLY != 'true' || steps.rust-cache.outputs.cache-hit != 'true'
        run: |
          for try in 1 2 3; do cargo xtask web --release && exit 0; sleep 30; done; exit 1
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: github.event_name != 'schedule'
        with:
          name: web
          path: target/web
          if-no-files-found: error

  build-macos:
    name: Build and package macOS (Apple silicon)
    runs-on: macos-15
    permissions:
      contents: read
      # Reading this run's artifacts (the web client) while it runs.
      actions: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: ./.github/actions/rust-toolchain
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        id: rust-cache
        with:
          key: release
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        id: ghostty
        with:
          path: .ghostty-vt
          # CI's `macos` job's key (.github/workflows/ci.yml).
          key: ghostty-vt-macos-${{ runner.os }}-${{ hashFiles('vendor/ghostty-vt-sys/GHOSTTY.lock', 'vendor/ghostty-vt-sys/build.rs') }}
      # Zig builds libghostty-vt, when it isn't cached.
      - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2
        if: steps.ghostty.outputs.cache-hit != 'true'
        with:
          version: 0.17.1
      # libghostty-vt's build needs the aro C front end, which its Zig
      # packages fetch from codeberg.org; that host doesn't always resolve on
      # GitHub's runners (it failed 0.0.7 and 0.0.8). The same commit from
      # GitHub has the same package hash, so it goes in Zig's cache first.
      - name: aro from GitHub
        if: steps.ghostty.outputs.cache-hit != 'true'
        # By git, not GitHub's archive: Zig keeps an archive with its top
        # folder, and that copy hashes differently when a build reuses it.
        run: zig fetch "git+https://github.com/Vexu/arocc#d0c8c4d9c55daa7ef6e40cf0f630a5b5e900989b"
      # The stable bundle (the green icon, data in ~/.agentloft); the web
      # client goes in when it is packaged.
      # Building libghostty-vt (the terminal) downloads its Zig packages,
      # and a dropped download has failed releases: tried up to three times.
      - if: env.WARM_ONLY != 'true' || steps.rust-cache.outputs.cache-hit != 'true'
        run: |
          for try in 1 2 3; do cargo xtask bundle --stable --no-web && exit 0; sleep 30; done; exit 1
      # The web job builds the browser client meanwhile and is nearly always
      # done by now (5 minutes from nothing, against 13 or more here). Taken
      # from this run's artifacts as soon as it is there.
      - name: Web client (from the web job)
        if: github.event_name != 'schedule'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for try in $(seq 1 60); do
            rm -rf web
            gh run download "$GITHUB_RUN_ID" --repo "$GITHUB_REPOSITORY" --name web --dir web && exit 0
            ended=$(gh run view "$GITHUB_RUN_ID" --repo "$GITHUB_REPOSITORY" --json jobs \
              --jq '.jobs[] | select(.name == "Web client") | .conclusion')
            if [ -n "$ended" ] && [ "$ended" != success ]; then
              echo "::error::the web client's job ended: $ended"
              exit 1
            fi
            sleep 20
          done
          echo "::error::no web client after 20 minutes"
          exit 1
      - name: Disk image
        if: github.event_name != 'schedule'
        run: |
          mkdir -p dmg
          ditto target/bundle/stable/Agentloft.app dmg/Agentloft.app
          ditto web dmg/Agentloft.app/Contents/Resources/web
          # Signed again (ad-hoc) now that the web client is inside.
          codesign --force --deep --sign - dmg/Agentloft.app
          ln -s /Applications dmg/Applications
          mkdir -p dist
          hdiutil create -volname Agentloft -srcfolder dmg -ov -format UDZO dist/Agentloft-macos-arm64.dmg
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: github.event_name != 'schedule'
        with:
          name: macos
          path: dist/Agentloft-macos-arm64.dmg
          if-no-files-found: error

  build-windows:
    name: Build Windows (x64)
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: ./.github/actions/rust-toolchain
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        id: rust-cache
        with:
          # Shared with test-windows, which reads it.
          shared-key: release-windows
          save-if: ${{ github.ref == 'refs/heads/main' }}
          # Windows builds are slow (no Linux-speed disk): keep what was
          # built even when a later step fails.
          cache-on-failure: true
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        id: ghostty
        with:
          path: .ghostty-vt
          # CI's `windows` job's key (.github/workflows/ci.yml).
          key: ghostty-vt-windows-${{ runner.os }}-${{ hashFiles('vendor/ghostty-vt-sys/GHOSTTY.lock', 'vendor/ghostty-vt-sys/build.rs') }}
      # Zig builds libghostty-vt, when it isn't cached.
      - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2
        if: steps.ghostty.outputs.cache-hit != 'true'
        with:
          version: 0.17.1
      # libghostty-vt's build needs the aro C front end, which its Zig
      # packages fetch from codeberg.org; that host doesn't always resolve on
      # GitHub's runners (it failed 0.0.7 and 0.0.8). The same commit from
      # GitHub has the same package hash, so it goes in Zig's cache first.
      - name: aro from GitHub
        if: steps.ghostty.outputs.cache-hit != 'true'
        # By git, not GitHub's archive: Zig keeps an archive with its top
        # folder, and that copy hashes differently when a build reuses it.
        run: zig fetch "git+https://github.com/Vexu/arocc#d0c8c4d9c55daa7ef6e40cf0f630a5b5e900989b"
      # Building libghostty-vt (the terminal) downloads its Zig packages,
      # and a dropped download has failed releases: tried up to three times.
      - if: env.WARM_ONLY != 'true' || steps.rust-cache.outputs.cache-hit != 'true'
        run: |
          foreach ($try in 1..3) {
            cargo build --release -p loft-app -p loftd
            if ($LASTEXITCODE -eq 0) { exit 0 }
            Start-Sleep -Seconds 30
          }
          exit 1
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: github.event_name != 'schedule'
        with:
          name: build-windows
          path: |
            target/release/agentloft.exe
            target/release/agentloftd.exe
          if-no-files-found: error

  # The daemon end to end on Windows (its named pipe, PATH lookups), in a
  # release build. Reported without holding the release back: nothing waits
  # for this job (it was in build-windows, and packaging waited 4-8 minutes
  # for it). CI runs the same tests on every push to main.
  test-windows:
    name: Test Windows (config, client, daemon end to end)
    if: github.event_name != 'schedule'
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: ./.github/actions/rust-toolchain
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          shared-key: release-windows
          save-if: false
      - uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        id: ghostty
        with:
          path: .ghostty-vt
          key: ghostty-vt-windows-${{ runner.os }}-${{ hashFiles('vendor/ghostty-vt-sys/GHOSTTY.lock', 'vendor/ghostty-vt-sys/build.rs') }}
      - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2
        if: steps.ghostty.outputs.cache-hit != 'true'
        with:
          version: 0.17.1
      - name: aro from GitHub
        if: steps.ghostty.outputs.cache-hit != 'true'
        run: zig fetch "git+https://github.com/Vexu/arocc#d0c8c4d9c55daa7ef6e40cf0f630a5b5e900989b"
      - name: Test (config, client, daemon end to end)
        run: |
          cargo test --release -p loft-config -p loft-client --lib
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo test --release -p loftd --test e2e

  build-linux:
    name: Build Linux (x64)
    # The oldest supported runner: the binaries then run on any distribution
    # with glibc 2.35 or newer.
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: System libraries (GPUI)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config clang libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev \
            libfontconfig1-dev libfreetype-dev libx11-xcb-dev libxcb1-dev \
            libvulkan-dev libasound2-dev libssl-dev libzstd-dev
      - uses: ./.github/actions/rust-toolchain
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        id: rust-cache
        with:
          key: release
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        id: ghostty
        with:
          path: .ghostty-vt
          # CI's `linux-app` job's key (.github/workflows/ci.yml). It builds
          # on a newer Ubuntu, but Zig builds for its own `x86_64-linux-gnu`
          # whatever the runner, so the library is the same.
          key: ghostty-vt-linux-app-${{ runner.os }}-${{ hashFiles('vendor/ghostty-vt-sys/GHOSTTY.lock', 'vendor/ghostty-vt-sys/build.rs') }}
      # Zig builds libghostty-vt, when it isn't cached.
      - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2
        if: steps.ghostty.outputs.cache-hit != 'true'
        with:
          version: 0.17.1
      # libghostty-vt's build needs the aro C front end, which its Zig
      # packages fetch from codeberg.org; that host doesn't always resolve on
      # GitHub's runners (it failed 0.0.7 and 0.0.8). The same commit from
      # GitHub has the same package hash, so it goes in Zig's cache first.
      - name: aro from GitHub
        if: steps.ghostty.outputs.cache-hit != 'true'
        # By git, not GitHub's archive: Zig keeps an archive with its top
        # folder, and that copy hashes differently when a build reuses it.
        run: zig fetch "git+https://github.com/Vexu/arocc#d0c8c4d9c55daa7ef6e40cf0f630a5b5e900989b"
      # Building libghostty-vt (the terminal) downloads its Zig packages,
      # and a dropped download has failed releases: tried up to three times.
      - if: env.WARM_ONLY != 'true' || steps.rust-cache.outputs.cache-hit != 'true'
        run: |
          for try in 1 2 3; do cargo build --release -p loft-app -p loftd && exit 0; sleep 30; done; exit 1
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: github.event_name != 'schedule'
        with:
          name: build-linux
          path: |
            target/release/agentloft
            target/release/agentloftd
          if-no-files-found: error

  package-windows:
    name: Package Windows
    needs: [web, build-windows]
    if: github.event_name != 'schedule'
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: build-windows
          path: dist/Agentloft
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: web
          path: dist/Agentloft/web
      - name: Zip
        shell: pwsh
        run: |
          Copy-Item LICENSE, THIRD_PARTY_NOTICES.md dist/Agentloft/
          Compress-Archive -Path dist/Agentloft -DestinationPath dist/Agentloft-windows-x64.zip
      - name: Installer
        shell: pwsh
        run: |
          # Inno Setup, pinned: the official installer from jrsoftware's own
          # release (github.com/jrsoftware/issrc, tag is-6_7_4), checked
          # against the SHA-256 of that file as downloaded and hashed on
          # 2026-11-18 (the same digest GitHub lists for the asset). Not the
          # runner's copy or Chocolatey's package: their version changes
          # under us. Staying on 6.x: packaging/windows/agentloft.iss is
          # written for Inno Setup 6.
          $innoVersion = '6.7.4'
          $innoSha256 = 'a549929319f9120716677c685535ca4671e4b937b5fdc87e2585f32d8eb30e8c'
          $innoSetup = Join-Path $env:RUNNER_TEMP "innosetup-$innoVersion.exe"
          $innoTag = 'is-' + $innoVersion.Replace('.', '_')
          Invoke-WebRequest -Uri "https://github.com/jrsoftware/issrc/releases/download/$innoTag/innosetup-$innoVersion.exe" -OutFile $innoSetup
          $innoHash = (Get-FileHash -Algorithm SHA256 $innoSetup).Hash
          if ($innoHash -ne $innoSha256) {
            throw "innosetup-$innoVersion.exe has SHA-256 $innoHash, expected $innoSha256"
          }
          $innoDir = Join-Path $env:RUNNER_TEMP 'InnoSetup'
          $install = Start-Process -FilePath $innoSetup -Wait -PassThru -ArgumentList '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', '/SP-', "/DIR=$innoDir"
          if ($install.ExitCode -ne 0) { throw "Inno Setup's installer failed ($($install.ExitCode))" }
          # Where it went (a copy already on the runner is updated in place)
          # and which version is there now, from the uninstall entry the
          # installer writes. ISCC.exe has no version resource of its own
          # (it reads 0.0.0.0).
          $entry = @(
            'HKLM:\SOFTWARE\WOW6432Node\Microsoft\Windows\CurrentVersion\Uninstall\Inno Setup 6_is1',
            'HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Uninstall\Inno Setup 6_is1',
            'HKCU:\SOFTWARE\Microsoft\Windows\CurrentVersion\Uninstall\Inno Setup 6_is1'
          ) | Where-Object { Test-Path $_ } | ForEach-Object { Get-ItemProperty $_ } | Select-Object -First 1
          if (-not $entry) { throw "Inno Setup's installer left no uninstall entry" }
          if (-not ([string]$entry.DisplayVersion).StartsWith($innoVersion)) {
            throw "Inno Setup $($entry.DisplayVersion) is installed, expected $innoVersion"
          }
          $iscc = Join-Path $entry.InstallLocation 'ISCC.exe'
          if (-not (Test-Path $iscc)) { throw "ISCC.exe isn't in $($entry.InstallLocation)" }
          # [workspace.package] version in Cargo.toml.
          $version = (Select-String -Path Cargo.toml -Pattern '^version = "(.+)"' | Select-Object -First 1).Matches[0].Groups[1].Value
          & $iscc "/DAppVersion=$version" "/DSourceDir=$PWD\dist\Agentloft" "/DOutputDir=$PWD\dist" packaging/windows/agentloft.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: windows
          path: |
            dist/Agentloft-windows-x64-setup.exe
            dist/Agentloft-windows-x64.zip
          if-no-files-found: error

  package-linux:
    name: Package Linux
    needs: [web, build-linux]
    if: github.event_name != 'schedule'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: build-linux
          path: dist/agentloft/bin
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: web
          path: dist/agentloft/web
      - name: Package
        run: |
          d=dist/agentloft
          chmod +x $d/bin/*
          mkdir -p $d/share/applications
          cp packaging/linux/dev.agentloft.Agentloft.desktop $d/share/applications/
          for s in 16 24 32 48 64 128 256 512; do
            mkdir -p $d/share/icons/hicolor/${s}x${s}/apps
            cp assets/icon/png/agentloft-$s.png $d/share/icons/hicolor/${s}x${s}/apps/dev.agentloft.Agentloft.png
          done
          cp packaging/linux/install.sh LICENSE THIRD_PARTY_NOTICES.md $d/
          tar -C dist -czf dist/Agentloft-linux-x64.tar.gz agentloft
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: linux
          path: dist/Agentloft-linux-x64.tar.gz
          if-no-files-found: error

  publish:
    name: Publish the release
    needs: [build-macos, package-windows, package-linux]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: dist
          pattern: "{macos,windows,linux}"
          merge-multiple: true
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          ls -la dist
          prerelease=""
          case "$TAG" in *-*) prerelease="--prerelease" ;; esac
          cat > notes.md <<'EOF'
          Agentloft for macOS (Apple silicon), Windows (x64) and Linux (x64). Early preview builds, not yet signed.

          - **macOS:** open the .dmg and drag Agentloft to Applications. The first time, right-click the app and choose Open (or allow it in System Settings ▸ Privacy & Security).
          - **Windows:** run the setup .exe (no administrator rights needed). SmartScreen may warn about an unrecognised app: choose More info ▸ Run anyway. The .zip is the same app without an installer.
          - **Linux:** extract the .tar.gz and run `./agentloft/install.sh` (installs to ~/.local), or run `agentloft/bin/agentloft` in place.

          Agentloft runs the coding agents you have installed (Claude Code, Codex, ACP agents): install and sign in to at least one first.
          EOF
          gh release create "$TAG" dist/* --repo "$GITHUB_REPOSITORY" \
            --title "Agentloft $TAG" --notes-file notes.md $prerelease
