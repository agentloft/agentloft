[workspace]
resolver = "3"
members = ["crates/*", "xtask"]
default-members = ["crates/*"]
exclude = ["vendor"]

[workspace.package]
version = "0.0.1"
edition = "2024"
license = "Apache-2.0"
repository = "https://github.com/agentloft/agentloft"
publish = false

[workspace.dependencies]
# internal
loft-protocol = { path = "crates/loft-protocol" }
loft-config = { path = "crates/loft-config" }
loft-store = { path = "crates/loft-store" }
loft-harness = { path = "crates/loft-harness" }
loft-harness-claude = { path = "crates/loft-harness-claude" }
loft-harness-codex = { path = "crates/loft-harness-codex" }
loft-harness-acp = { path = "crates/loft-harness-acp" }
loft-core = { path = "crates/loft-core" }
loft-client = { path = "crates/loft-client" }
loft-ui = { path = "crates/loft-ui" }
loft-git = { path = "crates/loft-git" }
loft-terminal = { path = "crates/loft-terminal" }
loft-view = { path = "crates/loft-view" }
# One build of each dependency whatever the cargo command (.config/hakari.toml).
workspace-hack = { path = "crates/workspace-hack" }

# UI — gpui-kit pins the matching gpui-pre release (ADR-0005). Syntax
# highlighting is chosen per target in loft-ui: tree-sitter natively, syntect
# in the browser (tree-sitter's C grammars don't build for wasm32).
gpui-kit = { version = "=0.9.0" }

# terminal (ADR-0007): Ghostty's libghostty-vt, built from the pinned Ghostty
# 1.4.0 source tarball with Zig 0.17 (needs `zig` 0.17.x on PATH or in $ZIG)
ghostty-vt = { version = "=0.8.0", default-features = false }
portable-pty = "0.9"

# async / io
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "io-util", "io-std", "process", "sync", "time", "signal", "fs"] }
tokio-util = { version = "0.7", features = ["codec"] }
futures = "0.3"
bytes = "1"

# data
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4", "v7", "serde"] }
rusqlite = { version = "0.41", features = ["bundled"] }
toml = "0.9"
toml_edit = "0.25"
base64 = "0.22"
ignore = "0.4"

# embedded browser (loft-browser, macOS): versions match wry's objc2 stack
wry = { version = "0.57.1", default-features = false, features = ["devtools"] }
objc2 = "0.6.3"
block2 = "0.6.2"
objc2-foundation = { version = "0.3.2", default-features = false, features = ["std", "objc2-core-foundation", "NSString", "NSError", "NSData", "NSDictionary", "NSValue", "NSGeometry", "NSObject", "NSURL", "NSSet", "NSDate"] }
objc2-app-kit = { version = "0.3.2", default-features = false, features = ["std", "objc2-core-foundation", "NSView", "NSResponder", "NSWindow", "NSImage", "NSImageRep", "NSBitmapImageRep", "NSGraphics", "NSEvent", "NSApplication", "NSGraphicsContext", "NSScreen", "block2"] }
objc2-web-kit = { version = "0.3.2", default-features = false, features = ["std", "block2", "objc2-app-kit", "objc2-core-foundation", "WKWebView", "WKContentWorld", "WKFrameInfo", "WKSnapshotConfiguration", "WKBackForwardList", "WKBackForwardListItem", "WKWebViewConfiguration", "WKWebsiteDataStore", "WKWebsiteDataRecord", "WKUserContentController", "WKScriptMessageHandler", "WKScriptMessage", "WKContentRuleListStore", "WKContentRuleList", "WKNavigation"] }
url = "2"

# misc
anyhow = "1"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
clap = { version = "4", features = ["derive"] }
libc = "0.2"
tempfile = "3"

# documents (loft-docs)
zip = { version = "9.5", default-features = false, features = ["deflate"] }
quick-xml = "0.42"
calamine = { version = "0.38", default-features = false }
csv = "1.4"
# PDF pages as pictures, drawn on the CPU (also in the browser build)
hayro = "0.9"

[workspace.lints.rust]
unsafe_code = "deny"

[workspace.lints.clippy]
dbg_macro = "warn"
todo = "warn"

[profile.dev]
opt-level = 0
debug = "line-tables-only"

[profile.dev.package."*"]
opt-level = 1

# Build scripts, proc macros and the crates they are made of get the same
# debug info as everything else. Left alone, Cargo gives them none, except
# when the same crate is also an ordinary dependency somewhere in the build
# at hand: and whether one is depends on the command. With xtask in the
# build (`--workspace`), `unicode-ident` is, so it was compiled differently,
# and with it every proc macro and everything that uses one: nearly the
# whole build a second time, for one crate.
[profile.dev.build-override]
debug = "line-tables-only"

# What `cargo xtask bundle` builds, after every change that is to be seen in
# the app: so a rebuild after an edit matters as much as the result.
#
# Dependencies are compiled as one unit each (as fast as each can be made;
# slow to build, but built once and kept), our own crates as sixteen, and
# nothing is optimized again across crates at link time. Against thin LTO
# with four units throughout, measured on this app: a rebuild after an edit
# to loft-ui 24.5 s -> 10.5 s (thin LTO took 14 s of every link, over every
# crate each time); the app's CPU with a turn running the same to within
# what two runs differ by (28.7% and 29.1% of a core); the binary 3%
# smaller. A build from nothing takes 100 s instead of 70.
[profile.release]
codegen-units = 16

[profile.release.package."*"]
codegen-units = 1

# The browser client (`cargo xtask web --release`): size matters most, since
# every byte is downloaded.
[profile.web-release]
inherits = "release"
opt-level = "s"
lto = "fat"
codegen-units = 1
debug = false
strip = "debuginfo"
panic = "abort"

# libghostty-vt's bindings with a wasm32 build added for the browser client
# (vendor/ghostty-vt-sys/README.md says what differs from crates.io).
[patch.crates-io]
ghostty-vt-sys = { path = "vendor/ghostty-vt-sys" }
